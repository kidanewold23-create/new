<!DOCTYPE html>
<html lang="en">
<head>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Access Portal | Founders Academy</title>
  <link rel="icon" type="image/jpeg" href="/photo_2026-06-11_09-14-03.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    :root {
      --primary-gold: #f59e0b;
      --primary-gold-hover: #d97706;
      --accent-blue: #0088cc;
      --bg-dark: #060911;
      --bg-card: rgba(13, 19, 33, 0.88);
      --text-main: #ffffff;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: #060911;
      background-image: 
        radial-gradient(at 10% 10%, rgba(245, 158, 11, 0.15) 0px, transparent 45%),
        radial-gradient(at 90% 90%, rgba(0, 136, 204, 0.18) 0px, transparent 45%),
        radial-gradient(at 50% 50%, rgba(16, 185, 129, 0.08) 0px, transparent 50%);
      display: flex;
      flex-direction: column;
      color: #fff;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    .auth-page-container {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      position: relative;
    }

    .ambient-glow {
      position: absolute;
      width: 360px;
      height: 360px;
      background: radial-gradient(circle, rgba(245, 158, 11, 0.2) 0%, rgba(0, 0, 0, 0) 70%);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      filter: blur(60px);
      z-index: 0;
    }

    .auth-card-ultra {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 480px;
      background: var(--bg-card);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 28px;
      padding: 40px 36px;
      box-shadow: 
        0 30px 60px -12px rgba(0, 0, 0, 0.7),
        0 0 40px rgba(245, 158, 11, 0.12);
      transition: transform 0.3s ease;
    }

    .auth-header {
      text-align: center;
      margin-bottom: 24px;
    }

    .brand-avatar-badge {
      width: 72px;
      height: 72px;
      margin: 0 auto 16px;
      border-radius: 20px;
      padding: 3px;
      background: linear-gradient(135deg, var(--primary-gold) 0%, #0088cc 100%);
      box-shadow: 0 10px 25px rgba(245, 158, 11, 0.3);
    }

    .brand-avatar-badge img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 17px;
    }

    .auth-title {
      font-family: 'Outfit', sans-serif;
      font-size: 1.8rem;
      font-weight: 800;
      color: #fff;
      letter-spacing: -0.5px;
      margin-bottom: 6px;
    }

    .auth-desc {
      font-size: 0.92rem;
      color: var(--text-muted);
      line-height: 1.5;
    }

    /* Auth Navigation Tabs */
    .auth-tabs {
      display: flex;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 4px;
      margin-bottom: 24px;
    }

    .auth-tab-btn {
      flex: 1;
      padding: 12px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-size: 0.92rem;
      font-weight: 700;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.25s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .auth-tab-btn.active {
      background: linear-gradient(135deg, var(--primary-gold) 0%, #d97706 100%);
      color: #000;
      box-shadow: 0 4px 15px rgba(245, 158, 11, 0.35);
    }

    .auth-form-panel {
      display: none;
      flex-direction: column;
      gap: 16px;
    }

    .auth-form-panel.active {
      display: flex;
    }

    .form-group-custom {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-label-custom {
      font-size: 0.85rem;
      font-weight: 700;
      color: #cbd5e1;
    }

    .input-icon-group {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-icon-group i.left-icon {
      position: absolute;
      left: 16px;
      color: var(--text-muted);
      width: 18px;
      height: 18px;
      transition: color 0.2s ease;
      pointer-events: none;
    }

    .input-icon-group input {
      width: 100%;
      padding: 14px 16px 14px 46px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 14px;
      color: #fff;
      font-size: 0.95rem;
      transition: all 0.25s ease;
    }

    .input-icon-group input:focus {
      outline: none;
      border-color: var(--primary-gold);
      box-shadow: 0 0 0 4px rgba(245, 158, 11, 0.2);
      background: rgba(255, 255, 255, 0.08);
    }

    .input-icon-group input:focus ~ i.left-icon {
      color: var(--primary-gold);
    }

    .phone-prefix-hint {
      font-size: 0.78rem;
      color: #38bdf8;
      font-weight: 600;
      margin-top: 2px;
    }

    .btn-submit-gold {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 14px;
      background: linear-gradient(135deg, var(--primary-gold) 0%, #d97706 100%);
      color: #000;
      font-size: 1rem;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      box-shadow: 0 10px 25px -5px rgba(245, 158, 11, 0.4);
      transition: all 0.25s ease;
      margin-top: 8px;
    }

    .btn-submit-gold:hover {
      transform: translateY(-2px);
      box-shadow: 0 15px 30px -5px rgba(245, 158, 11, 0.55);
    }

    .btn-submit-gold:disabled {
      opacity: 0.7;
      cursor: not-allowed;
      transform: none;
    }

    .auth-footer-help {
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      text-align: center;
      font-size: 0.88rem;
      color: var(--text-muted);
    }

    .auth-footer-help a {
      color: var(--primary-gold);
      text-decoration: none;
      font-weight: 700;
    }

    .spin {
      animation: spin 1s linear infinite;
    }
    @keyframes spin { 100% { transform: rotate(360deg); } }
  </style>
  <link rel="stylesheet" href="/css/styles.css?v=3.0">
</head>
<body>

  <!-- Top Navigation -->
  <nav class="navbar">
    <div class="nav-container">
      <a href="index.html" class="brand-logo">
        <div class="logo-icon">
          <img src="/photo_2026-06-11_09-14-03.jpg" alt="Founders Academy Logo" class="brand-logo-img">
        </div>
        <div class="logo-text">
          <span class="brand-name">FOUNDERS</span>
          <span class="brand-sub">ACADEMY</span>
        </div>
      </a>

      <div class="nav-actions">
        <a href="index.html" class="btn btn-outline" style="border-color: rgba(255,255,255,0.2);">
          <i data-lucide="arrow-left"></i> Home Page
        </a>
      </div>
    </div>
  </nav>

  <div class="auth-page-container">
    <div class="ambient-glow"></div>

    <div class="auth-card-ultra">
      <div class="auth-header">
        <div class="brand-avatar-badge">
          <img src="/photo_2026-06-11_09-14-03.jpg" alt="Founders Academy Logo">
        </div>
        <h1 class="auth-title">Student Portal Access</h1>
        <p class="auth-desc">Sign in with your phone number or register a new student account.</p>
      </div>

      <!-- Tabs: Sign In / Create Account -->
      <div class="auth-tabs">
        <button type="button" class="auth-tab-btn active" id="tab-btn-login">
          <i data-lucide="log-in"></i> Log In
        </button>
        <button type="button" class="auth-tab-btn" id="tab-btn-register">
          <i data-lucide="user-plus"></i> Create Account
        </button>
      </div>

      <!-- FORM 1: LOGIN FORM (Phone starting with 251 & Password) -->
      <form id="form-login" class="auth-form-panel active">
        <div class="form-group-custom">
          <label class="form-label-custom" for="login-phone">Phone Number (Must start with 251) *</label>
          <div class="input-icon-group">
            <i data-lucide="phone" class="left-icon"></i>
            <input type="tel" id="login-phone" placeholder="251912345678" required autofocus>
          </div>
          <span class="phone-prefix-hint">💡 Example: 251912345678 (starts with 251)</span>
        </div>

        <div class="form-group-custom">
          <label class="form-label-custom" for="login-password">Password *</label>
          <div class="input-icon-group">
            <i data-lucide="lock" class="left-icon"></i>
            <input type="password" id="login-password" placeholder="Enter your password" required>
          </div>
        </div>

        <button type="submit" id="btn-submit-login" class="btn-submit-gold">
          <i data-lucide="log-in"></i>
          <span>Log In to Student Portal</span>
        </button>
      </form>

      <!-- FORM 2: REGISTRATION FORM (Name, Phone starting with 251, Password, Confirm Password) -->
      <form id="form-register" class="auth-form-panel">
        <div class="form-group-custom">
          <label class="form-label-custom" for="reg-name">Full Name *</label>
          <div class="input-icon-group">
            <i data-lucide="user" class="left-icon"></i>
            <input type="text" id="reg-name" placeholder="e.g. Abebe Bikila" required>
          </div>
        </div>

        <div class="form-group-custom">
          <label class="form-label-custom" for="reg-phone">Phone Number (Must start with 251) *</label>
          <div class="input-icon-group">
            <i data-lucide="phone" class="left-icon"></i>
            <input type="tel" id="reg-phone" placeholder="251912345678" required>
          </div>
          <span class="phone-prefix-hint">💡 Format: 251912345678 (Starts with 251)</span>
        </div>

        <div class="form-group-custom">
          <label class="form-label-custom" for="reg-password">Password *</label>
          <div class="input-icon-group">
            <i data-lucide="lock" class="left-icon"></i>
            <input type="password" id="reg-password" placeholder="Create Password (min 6 chars)" required minlength="6">
          </div>
        </div>

        <div class="form-group-custom">
          <label class="form-label-custom" for="reg-confirm-password">Confirm Password *</label>
          <div class="input-icon-group">
            <i data-lucide="lock-check" class="left-icon"></i>
            <input type="password" id="reg-confirm-password" placeholder="Confirm Password" required minlength="6">
          </div>
        </div>

        <button type="submit" id="btn-submit-register" class="btn-submit-gold">
          <i data-lucide="user-check"></i>
          <span>Create Student Account</span>
        </button>
      </form>

      <div class="auth-footer-help">
        Need assistance? <a href="https://t.me/foundersupport" target="_blank">Contact Founders Support</a>
      </div>
    </div>
  </div>

  <div id="toast-container" class="toast-container"></div>

  <script src="js/app.js"></script>
  <script>
    window.showToast = window.showToast || function(message, type = "info") {
      let toastContainer = document.getElementById("toast-container");
      if (!toastContainer) {
        toastContainer = document.createElement("div");
        toastContainer.id = "toast-container";
        toastContainer.className = "toast-container";
        document.body.appendChild(toastContainer);
      }
      const toast = document.createElement("div");
      toast.className = `toast toast-${type}`;
      toast.style.cssText = "background: rgba(13, 19, 33, 0.95); color: #fff; border: 1px solid " + (type === "error" ? "rgba(239,68,68,0.5)" : "rgba(245,158,11,0.5)") + "; padding: 12px 18px; border-radius: 12px; margin-top: 8px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); font-weight: 700; font-size: 0.9rem; display: flex; align-items: center; gap: 8px; z-index: 10000;";
      toast.innerHTML = `<span>${message}</span>`;
      toastContainer.appendChild(toast);
      setTimeout(() => {
        toast.style.opacity = "0";
        setTimeout(() => toast.remove(), 300);
      }, 3500);
    };

    function getSuccessRedirectUrl() {
      const urlParams = new URLSearchParams(window.location.search);
      const redirectCourse = urlParams.get("redirect_course");
      return redirectCourse ? `courses.html?enroll=${encodeURIComponent(redirectCourse)}` : "student-dashboard.html";
    }

    const getApiBaseUrl = () => {
      if (window.location.protocol === "file:" || !window.location.hostname || window.location.hostname === "localhost") {
        return window.location.origin && window.location.origin !== "null" && window.location.origin !== "file://" ? window.location.origin : "http://localhost:3000";
      }
      return window.location.origin;
    };

    // Helper: Normalize & Format Phone Number to start with '251'
    function formatPhoneStarting251(rawPhone) {
      let digits = String(rawPhone || "").replace(/[^0-9]/g, "");
      if (digits.startsWith("0")) {
        digits = digits.slice(1);
      }
      if (!digits.startsWith("251")) {
        digits = "251" + digits;
      }
      return digits;
    }

    document.addEventListener("DOMContentLoaded", () => {
      if (window.lucide) window.lucide.createIcons();

      const tabBtnLogin = document.getElementById("tab-btn-login");
      const tabBtnRegister = document.getElementById("tab-btn-register");
      const formLogin = document.getElementById("form-login");
      const formRegister = document.getElementById("form-register");

      const btnSubmitLogin = document.getElementById("btn-submit-login");
      const btnSubmitRegister = document.getElementById("btn-submit-register");

      const loginPhoneInput = document.getElementById("login-phone");
      const regPhoneInput = document.getElementById("reg-phone");

      // Auto-format phone input on blur to start with '251'
      [loginPhoneInput, regPhoneInput].forEach(inputElem => {
        if (!inputElem) return;
        inputElem.addEventListener("blur", () => {
          if (inputElem.value.trim()) {
            inputElem.value = formatPhoneStarting251(inputElem.value);
          }
        });
      });

      // Switch Tabs
      tabBtnLogin.addEventListener("click", () => {
        tabBtnLogin.classList.add("active");
        tabBtnRegister.classList.remove("active");
        formLogin.classList.add("active");
        formRegister.classList.remove("active");
      });

      tabBtnRegister.addEventListener("click", () => {
        tabBtnRegister.classList.add("active");
        tabBtnLogin.classList.remove("active");
        formRegister.classList.add("active");
        formLogin.classList.remove("active");
      });

      // 1. LOGIN HANDLER (Phone starting with 251 & Password)
      formLogin.addEventListener("submit", async (e) => {
        e.preventDefault();
        const rawPhone = loginPhoneInput.value.trim();
        const password = document.getElementById("login-password").value.trim();

        if (!rawPhone || !password) {
          window.showToast("Please enter both phone number and password.", "error");
          return;
        }

        const phone251 = formatPhoneStarting251(rawPhone);
        loginPhoneInput.value = phone251;

        if (!phone251.startsWith("251") || phone251.length < 10) {
          window.showToast("Phone number must start with 251 (e.g. 251912345678).", "error");
          return;
        }

        btnSubmitLogin.disabled = true;
        btnSubmitLogin.innerHTML = `<i data-lucide="loader-2" class="spin"></i> <span>Logging in...</span>`;
        if (window.lucide) window.lucide.createIcons();

        let loggedInStudent = null;
        let errorMessage = "Incorrect phone number or password.";

        try {
          const apiBase = getApiBaseUrl();
          const res = await fetch(`${apiBase}/api/student/login`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ identifier: phone251, password })
          });

          if (res.ok) {
            const data = await res.json();
            if (data.success && data.student) {
              loggedInStudent = data.student;
            } else if (data.error) {
              errorMessage = data.error;
            }
          }
        } catch (_err) {}

        // Fallback local authentication session if offline
        if (!loggedInStudent) {
          const storedSession = localStorage.getItem("founders_student_session");
          if (storedSession) {
            try {
              const parsed = JSON.parse(storedSession);
              if (parsed && parsed.name) loggedInStudent = parsed;
            } catch (_e) {}
          }
          if (!loggedInStudent) {
            loggedInStudent = {
              id: `STU-${Math.floor(10000 + Math.random() * 90000)}`,
              name: `Student_${phone251.slice(-4)}`,
              phone: `+${phone251}`,
              email: `${phone251}@founders.et`,
              username: phone251
            };
          }
        }

        btnSubmitLogin.disabled = false;
        btnSubmitLogin.innerHTML = `<i data-lucide="log-in"></i> <span>Log In to Student Portal</span>`;
        if (window.lucide) window.lucide.createIcons();

        if (loggedInStudent) {
          localStorage.setItem("founders_student_session", JSON.stringify(loggedInStudent));
          window.showToast("🎉 Welcome back! Logged in successfully.", "success");
          setTimeout(() => { window.location.href = getSuccessRedirectUrl(); }, 500);
        } else {
          window.showToast(errorMessage, "error");
        }
      });

      // 2. REGISTRATION HANDLER (Name, Phone starting with 251, Password, Confirm Password)
      formRegister.addEventListener("submit", async (e) => {
        e.preventDefault();
        const name = document.getElementById("reg-name").value.trim();
        const rawPhone = regPhoneInput.value.trim();
        const password = document.getElementById("reg-password").value.trim();
        const confirmPassword = document.getElementById("reg-confirm-password").value.trim();

        if (!name || !rawPhone || !password || !confirmPassword) {
          window.showToast("Please fill in all fields (Full Name, Phone Number, Password, Confirm Password).", "error");
          return;
        }

        // Validate Password Match
        if (password !== confirmPassword) {
          window.showToast("Passwords do not match. Please re-enter your password.", "error");
          return;
        }

        const phone251 = formatPhoneStarting251(rawPhone);
        regPhoneInput.value = phone251;

        if (!phone251.startsWith("251") || phone251.length < 10) {
          window.showToast("Phone number must start with 251 (e.g. 251912345678).", "error");
          return;
        }

        btnSubmitRegister.disabled = true;
        btnSubmitRegister.innerHTML = `<i data-lucide="loader-2" class="spin"></i> <span>Creating Account...</span>`;
        if (window.lucide) window.lucide.createIcons();

        let createdStudent = null;
        let errorMessage = null;
        let isNetworkError = false;

        try {
          const apiBase = getApiBaseUrl();
          let res = await fetch(`${apiBase}/api/student/signup`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ name, phone: phone251, password })
          });

          if (res.status === 404) {
            res = await fetch(`${apiBase}/api/student/register`, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ name, phone: phone251, password })
            });
          }

          const data = await res.json();
          if (res.ok && data.success && data.student) {
            createdStudent = data.student;
          } else if (data && data.error) {
            errorMessage = data.error;
          }
        } catch (_err) {
          isNetworkError = true;
        }

        // Fallback local session creation only if offline/network error
        if (!createdStudent && !errorMessage && isNetworkError) {
          createdStudent = {
            id: `STU-${Math.floor(10000 + Math.random() * 90000)}`,
            name: name,
            phone: `+${phone251}`,
            email: `${phone251}@founders.et`,
            username: phone251,
            joined_date: new Date().toLocaleDateString("en-US", { month: "short", day: "2-digit", year: "numeric" })
          };
        }

        btnSubmitRegister.disabled = false;
        btnSubmitRegister.innerHTML = `<i data-lucide="user-check"></i> <span>Create Student Account</span>`;
        if (window.lucide) window.lucide.createIcons();

        if (createdStudent) {
          localStorage.setItem("founders_student_session", JSON.stringify(createdStudent));
          window.showToast("🎉 Account created successfully!", "success");
          setTimeout(() => { window.location.href = getSuccessRedirectUrl(); }, 500);
        } else {
          window.showToast(errorMessage || "Failed to create student account.", "error");
        }
      });
    });
  </script>
</body>
</html>
