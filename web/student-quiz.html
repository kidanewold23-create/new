<!DOCTYPE html>
<html lang="en">
<head>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Course Quizzes & Assessment | Founders Academy</title>
  <link rel="icon" type="image/jpeg" href="photo_2026-06-11_09-14-03.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
  
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Canvas Confetti Library for Boom Explosion Effect -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <link rel="stylesheet" href="/css/styles.css?v=3.0">
  <link rel="stylesheet" href="/css/auth.css?v=3.0">

  <style>
    :root {
      --primary-gold: #f59e0b;
      --gold-glow: rgba(245, 158, 11, 0.35);
      --emerald-glow: rgba(16, 185, 129, 0.35);
      --bg-dark: #070a12;
    }
    body {
      background: var(--bg-dark);
      background-image: 
        radial-gradient(at 10% 10%, rgba(245, 158, 11, 0.12) 0px, transparent 45%),
        radial-gradient(at 90% 90%, rgba(99, 102, 241, 0.12) 0px, transparent 45%),
        radial-gradient(at 50% 50%, rgba(16, 185, 129, 0.05) 0px, transparent 60%);
      font-family: 'Plus Jakarta Sans', sans-serif;
      color: #f8fafc;
      min-height: 100vh;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
    }

    /* Keyframe Animations */
    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(24px) scale(0.98);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes boomPop {
      0% { transform: scale(0.2) rotate(-15deg); opacity: 0; }
      50% { transform: scale(1.25) rotate(5deg); opacity: 1; filter: drop-shadow(0 0 40px #f59e0b); }
      70% { transform: scale(0.95) rotate(-2deg); }
      100% { transform: scale(1) rotate(0deg); opacity: 1; filter: drop-shadow(0 0 25px rgba(16,185,129,0.6)); }
    }

    @keyframes pulseGlow {
      0%, 100% { box-shadow: 0 0 25px rgba(245, 158, 11, 0.2); }
      50% { box-shadow: 0 0 45px rgba(245, 158, 11, 0.5); }
    }

    @keyframes shimmerBar {
      0% { background-position: -200% 0; }
      100% { background-position: 200% 0; }
    }

    .quiz-container {
      max-width: 880px;
      margin: 40px auto;
      padding: 0 20px;
    }

    .quiz-card {
      background: rgba(15, 23, 42, 0.82);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 28px;
      padding: 36px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
      animation: fadeInUp 0.45s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      position: relative;
    }

    .quiz-module-item {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      padding: 24px;
      margin-bottom: 18px;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }
    .quiz-module-item:hover {
      transform: translateY(-3px);
    }
    .quiz-module-item.unlocked {
      border-color: rgba(245, 158, 11, 0.35);
      background: linear-gradient(135deg, rgba(245, 158, 11, 0.05) 0%, rgba(15, 23, 42, 0.6) 100%);
      box-shadow: 0 8px 20px -6px rgba(245, 158, 11, 0.15);
    }
    .quiz-module-item.passed {
      border-color: rgba(16, 185, 129, 0.4);
      background: linear-gradient(135deg, rgba(16, 185, 129, 0.06) 0%, rgba(15, 23, 42, 0.6) 100%);
      box-shadow: 0 8px 20px -6px rgba(16, 185, 129, 0.15);
    }
    .quiz-module-item.locked {
      opacity: 0.6;
      background: rgba(15, 23, 42, 0.4);
      border-color: rgba(255, 255, 255, 0.05);
    }

    .q-choice-label {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 16px 20px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 14px;
      cursor: pointer;
      transition: all 0.25s ease;
      margin-bottom: 12px;
      position: relative;
      overflow: hidden;
    }
    .q-choice-label:hover {
      background: rgba(255, 255, 255, 0.07);
      border-color: rgba(245, 158, 11, 0.45);
      transform: translateX(4px);
    }
    .q-choice-label.selected {
      background: rgba(245, 158, 11, 0.12);
      border-color: var(--primary-gold);
      box-shadow: 0 0 15px rgba(245, 158, 11, 0.2);
    }
    .q-choice-label input[type="radio"] {
      accent-color: var(--primary-gold);
      width: 20px;
      height: 20px;
      cursor: pointer;
    }

    .btn-submit-quiz {
      background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
      color: #000;
      font-weight: 800;
      border: none;
      padding: 18px 36px;
      border-radius: 16px;
      font-size: 1.05rem;
      cursor: pointer;
      width: 100%;
      box-shadow: 0 10px 30px var(--gold-glow);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .btn-submit-quiz:hover {
      transform: translateY(-3px) scale(1.01);
      box-shadow: 0 14px 40px rgba(245, 158, 11, 0.45);
    }

    .boom-winner-badge {
      animation: boomPop 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }

    .toast-container {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 10000;
    }
  </style>
</head>
<body>

  <!-- Main Fixed Header Wrapper -->
  <header class="navbar-wrapper">
    <!-- Main Navigation -->
    <nav class="navbar" id="navbar">
      <div class="nav-container">
        <a href="index.html" class="brand-logo">
          <div class="logo-icon">
            <img src="photo_2026-06-11_09-14-03.jpg" alt="Founders Academy Logo" class="brand-logo-img">
          </div>
          <div class="logo-text">
            <span class="brand-name">FOUNDERS</span>
            <span class="brand-sub">ACADEMY</span>
          </div>
        </a>

        <div class="nav-links" id="nav-links">
          <a href="index.html" class="nav-link"><i data-lucide="sparkles"></i> Home</a>
          <a href="index.html#personas" class="nav-link"><i data-lucide="target"></i> Who Is It For?</a>
          <a href="index.html#what-you-get" class="nav-link"><i data-lucide="gift"></i> What You Get</a>
          <a href="index.html#success-stories" class="nav-link"><i data-lucide="star"></i> Testimonials</a>
          <a href="student-dashboard.html" class="nav-link"><i data-lucide="layout-dashboard"></i> My Dashboard</a>
          <a href="student-auth.html" class="nav-link nav-link-login"><i data-lucide="log-in"></i> Log In</a>
        </div>

        <div class="nav-actions">
          <a href="student-dashboard.html" class="btn btn-primary" style="font-size: 0.85rem; padding: 8px 16px;">
            <i data-lucide="arrow-left"></i> My Dashboard
          </a>

          <!-- Mobile Menu Trigger -->
          <button class="mobile-toggle" id="mobile-toggle" type="button" onclick="toggleMobileMenu(event)" aria-label="Toggle Navigation Menu">
            <i data-lucide="menu"></i>
          </button>
        </div>
      </div>
    </nav>
  </header>

  <main class="quiz-container">
    <div class="quiz-card" id="quiz-portal-card">
      <div style="text-align: center; padding: 50px 20px; color: var(--text-muted);">
        <i data-lucide="loader" class="spin" style="width:40px;height:40px;color:var(--primary-gold);margin-bottom:14px;"></i>
        <p style="font-size: 1.05rem;">Loading interactive course assessment engine...</p>
      </div>
    </div>
  </main>

  <div id="toast-container" class="toast-container"></div>

  <script>
    let courseId = "course-smma-accelerator";
    let quizId = null;
    let quizData = null;
    let courseQuizzes = [];
    let studentAnswers = {};
    let studentSession = null;
    let timerSeconds = 15 * 60;
    let timerInterval = null;

    window.showToast = function(message, type = "info") {
      let toastContainer = document.getElementById("toast-container");
      if (!toastContainer) {
        toastContainer = document.createElement("div");
        toastContainer.id = "toast-container";
        toastContainer.className = "toast-container";
        document.body.appendChild(toastContainer);
      }
      const toast = document.createElement("div");
      toast.style.cssText = "background: rgba(13, 19, 33, 0.95); color: #fff; border: 1px solid " + (type === "error" ? "rgba(239,68,68,0.5)" : "rgba(245,158,11,0.5)") + "; padding: 14px 20px; border-radius: 14px; margin-top: 8px; box-shadow: 0 10px 30px rgba(0,0,0,0.6); font-weight: 700; font-size: 0.92rem; display: flex; align-items: center; gap: 10px; animation: fadeInUp 0.3s forwards;";
      toast.innerHTML = `<span>${message}</span>`;
      toastContainer.appendChild(toast);
      setTimeout(() => {
        toast.style.opacity = "0";
        setTimeout(() => toast.remove(), 300);
      }, 3800);
    };

    document.addEventListener("DOMContentLoaded", () => {
      if (window.lucide) window.lucide.createIcons();

      const sessionRaw = localStorage.getItem("founders_student_session");
      if (sessionRaw) {
        try { studentSession = JSON.parse(sessionRaw); } catch(_e) {}
      }

      const params = new URLSearchParams(window.location.search);
      if (params.get("course_id")) courseId = params.get("course_id");
      if (params.get("quiz_id")) quizId = params.get("quiz_id");

      loadCourseQuizzesPage();
    });

    async function loadCourseQuizzesPage() {
      try {
        const res = await fetch(`/api/courses/${encodeURIComponent(courseId)}/quizzes`);
        const json = await res.json();
        if (json.success && Array.isArray(json.data) && json.data.length > 0) {
          courseQuizzes = json.data;
        } else {
          courseQuizzes = getDefaultQuizzesForCourse(courseId);
        }
      } catch (_e) {
        courseQuizzes = getDefaultQuizzesForCourse(courseId);
      }

      if (quizId) {
        const selected = courseQuizzes.find(q => q.id === quizId);
        if (selected) {
          quizData = selected;
          renderQuizForm();
          return;
        }
      }

      renderQuizzesListHub();
    }

    function isQuizPassed(qId) {
      const key = `founders_quiz_passed_${courseId}_${qId}`;
      if (localStorage.getItem(key) === "true") return true;
      return false;
    }

    function getQuizScore(qId) {
      const key = `founders_quiz_score_${courseId}_${qId}`;
      const saved = localStorage.getItem(key);
      return saved !== null ? parseInt(saved, 10) : null;
    }

    function renderQuizzesListHub() {
      const portalCard = document.getElementById("quiz-portal-card");
      
      let passedCount = 0;
      courseQuizzes.forEach(q => {
        if (isQuizPassed(q.id)) passedCount++;
      });

      const totalCount = courseQuizzes.length;
      const progressPct = totalCount > 0 ? Math.round((passedCount / totalCount) * 100) : 0;

      portalCard.innerHTML = `
        <div style="border-bottom: 1px solid rgba(255,255,255,0.08); padding-bottom: 24px; margin-bottom: 28px;">
          <div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; flex-wrap: wrap;">
            <div>
              <span class="badge badge-gold" style="box-shadow: 0 0 15px rgba(245,158,11,0.2);">✨ Course Quizzes Hub</span>
              <h1 style="font-family: 'Outfit', sans-serif; font-size: 2rem; font-weight: 800; color: #fff; margin: 10px 0 6px 0; background: linear-gradient(135deg, #ffffff 0%, #cbd5e1 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">
                Module Assessments & Certification
              </h1>
              <p style="color: var(--text-muted); font-size: 0.95rem; margin: 0; max-width: 620px;">
                Pass each module quiz sequentially to unlock the next level and earn your verified Founders Academy Certificate.
              </p>
            </div>

            <a href="https://t.me/founders_academybot" target="_blank" rel="noopener noreferrer" class="btn btn-primary" style="background: linear-gradient(135deg, #10b981 0%, #059669 100%); color: #fff; text-decoration: none; font-weight: 700; box-shadow: 0 8px 20px rgba(16,185,129,0.3);">
              <i data-lucide="send"></i> Classroom Bot
            </a>
          </div>

          <div style="margin-top: 24px; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08); border-radius: 16px; padding: 20px;">
            <div style="display: flex; justify-content: space-between; font-size: 0.9rem; font-weight: 800; color: #e2e8f0; margin-bottom: 10px;">
              <span>🏆 Course Progress: ${passedCount} of ${totalCount} Quizzes Passed</span>
              <span style="color: var(--primary-gold); font-size: 1rem;">${progressPct}% Completed</span>
            </div>
            <div style="width: 100%; height: 10px; background: rgba(255,255,255,0.08); border-radius: 12px; overflow: hidden; position: relative;">
              <div style="width: ${progressPct}%; height: 100%; background: linear-gradient(90deg, #f59e0b 0%, #10b981 100%); border-radius: 12px; transition: width 0.6s cubic-bezier(0.16, 1, 0.3, 1); box-shadow: 0 0 15px rgba(16,185,129,0.4);"></div>
            </div>
          </div>
        </div>

        <div style="display: flex; flex-direction: column; gap: 18px;">
          ${courseQuizzes.map((q, idx) => {
            const passed = isQuizPassed(q.id);
            const score = getQuizScore(q.id);
            const isFirst = (idx === 0);
            const prevPassed = isFirst ? true : isQuizPassed(courseQuizzes[idx - 1].id);
            const unlocked = isFirst || prevPassed;

            return `
              <div class="quiz-module-item ${passed ? 'passed' : (unlocked ? 'unlocked' : 'locked')}">
                <div style="flex: 1; min-width: 260px;">
                  <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 8px;">
                    <span class="badge" style="background: ${passed ? 'rgba(16,185,129,0.2)' : (unlocked ? 'rgba(245,158,11,0.2)' : 'rgba(255,255,255,0.08)')}; color: ${passed ? '#34d399' : (unlocked ? '#fbbf24' : '#94a3b8')}; font-weight: 800; font-size: 0.78rem;">
                      ${passed ? '✅ PASSED' : (unlocked ? '🔓 UNLOCKED' : '🔒 LOCKED')}
                    </span>
                    <span style="font-size: 0.82rem; color: var(--text-muted);">Pass Score: ${q.passing_score || 70}%</span>
                  </div>

                  <h3 style="font-family: 'Outfit', sans-serif; font-size: 1.2rem; font-weight: 700; color: #fff; margin: 0 0 6px 0;">
                    ${idx + 1}. ${escapeHtml(q.title)}
                  </h3>
                  <p style="font-size: 0.88rem; color: var(--text-muted); margin: 0; line-height: 1.4;">
                    ${escapeHtml(q.description || 'Test your module knowledge and unlock the next assessment.')}
                  </p>
                </div>

                <div>
                  ${unlocked ? `
                    <button type="button" onclick="startSingleQuiz('${q.id}')" class="btn ${passed ? 'btn-outline' : 'btn-primary'}" style="padding: 12px 24px; font-weight: 800; text-decoration: none; ${passed ? 'border-color: rgba(16,185,129,0.5); color: #34d399;' : 'background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%); color: #000; box-shadow: 0 8px 20px var(--gold-glow);'}">
                      ${passed ? `Retake Quiz (${score !== null ? score + '%' : 'Passed'})` : `✍️ Start Quiz`}
                    </button>
                  ` : `
                    <button type="button" onclick="showLockedMessage(${idx})" class="btn btn-outline" style="padding: 12px 24px; font-weight: 700; opacity: 0.65; border-color: rgba(255,255,255,0.15); color: #94a3b8; cursor: not-allowed;">
                      <i data-lucide="lock" style="width:16px;height:16px;display:inline;"></i> Locked
                    </button>
                  `}
                </div>
              </div>
            `;
          }).join('')}
        </div>

        <!-- Official Certificate Credentials List -->
        <div style="margin-top: 36px; border-top: 1px solid rgba(255,255,255,0.08); padding-top: 28px;">
          <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; flex-wrap: wrap; gap: 10px;">
            <div>
              <span class="badge badge-gold" style="font-size: 0.75rem;">Verified Credentials</span>
              <h3 style="font-family: 'Outfit', sans-serif; font-size: 1.25rem; font-weight: 700; color: #fff; margin: 4px 0 0 0;">
                🎓 Course Certificate List
              </h3>
            </div>
            <span style="font-size: 0.82rem; color: ${passedCount === totalCount && totalCount > 0 ? '#34d399' : '#fbbf24'}; font-weight: 700;">
              ${passedCount === totalCount && totalCount > 0 ? '🟢 All Requirements Complete' : `🟡 ${passedCount}/${totalCount} Quizzes Completed`}
            </span>
          </div>

          <div style="background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08); border-radius: 16px; padding: 20px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 16px;">
            <div style="display: flex; align-items: center; gap: 14px;">
              <div style="width: 48px; height: 48px; border-radius: 14px; background: rgba(245,158,11,0.15); border: 1px solid var(--primary-gold); color: var(--primary-gold); display: flex; align-items: center; justify-content: center; font-size: 1.4rem;">
                <i data-lucide="award"></i>
              </div>
              <div>
                <div style="font-weight: 700; color: #fff; font-size: 1.02rem;">Official Course Certificate of Mastery</div>
                <div style="font-size: 0.82rem; color: var(--text-muted);">Verified Founders Academy Credentials & Shareable Link</div>
              </div>
            </div>
            <div>
              ${passedCount > 0 ? `
                <a href="certificate.html?course_id=${encodeURIComponent(courseId)}&student_name=${encodeURIComponent(studentSession ? studentSession.name : 'Student')}" target="_blank" class="btn btn-primary" style="padding: 12px 24px; font-weight: 800; font-size: 0.9rem; text-decoration: none; background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%); color: #000; box-shadow: 0 6px 20px rgba(245,158,11,0.35); display: inline-flex; align-items: center; gap: 8px;">
                  <i data-lucide="award"></i> Generate & Download Certificate
                </a>
              ` : `
                <button type="button" onclick="showLockedMessage(0)" class="btn btn-outline" style="padding: 12px 24px; font-size: 0.88rem; opacity: 0.6; border-color: rgba(255,255,255,0.15); color: #94a3b8;">
                  🔒 Pass Quiz to Generate
                </button>
              `}
            </div>
          </div>
        </div>
      `;

      if (window.lucide) window.lucide.createIcons();
    }

    function showLockedMessage(quizIndex) {
      const prevTitle = courseQuizzes[quizIndex - 1] ? courseQuizzes[quizIndex - 1].title : `Quiz #${quizIndex}`;
      window.showToast(`🔒 Pass Quiz #${quizIndex} (${prevTitle}) with at least 70% to unlock this quiz!`, "error");
    }

    function startSingleQuiz(qId) {
      quizId = qId;
      const selected = courseQuizzes.find(q => q.id === qId);
      if (selected) {
        quizData = selected;
        renderQuizForm();
      }
    }

    function renderQuizForm() {
      studentAnswers = {};
      const portalCard = document.getElementById("quiz-portal-card");
      const limitMins = quizData.time_limit_mins || 15;
      timerSeconds = limitMins * 60;
      startTimer();

      const questions = quizData.questions || [];

      portalCard.innerHTML = `
        <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.08); padding-bottom: 22px; margin-bottom: 28px; flex-wrap: wrap; gap: 14px;">
          <div>
            <span class="badge badge-gold" style="font-size: 0.8rem;">Pass Mark: ${quizData.passing_score || 70}%</span>
            <h1 style="font-family: 'Outfit', sans-serif; font-size: 1.6rem; font-weight: 800; color: #fff; margin: 8px 0 0 0;">
              ${escapeHtml(quizData.title || 'Course Assessment')}
            </h1>
          </div>

          <div style="background: rgba(245, 158, 11, 0.15); border: 1px solid var(--primary-gold); color: var(--primary-gold); padding: 12px 22px; border-radius: 16px; font-weight: 800; font-size: 1.15rem; display: flex; align-items: center; gap: 10px; box-shadow: 0 0 20px rgba(245,158,11,0.2);">
            <i data-lucide="clock"></i> Time Left: <span id="quiz-timer">15:00</span>
          </div>
        </div>

        <form onsubmit="submitStudentQuiz(event)">
          ${questions.map((q, idx) => `
            <div style="background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.08); border-radius: 20px; padding: 26px; margin-bottom: 22px; transition: border-color 0.2s ease;">
              <div style="font-weight: 700; font-size: 1.1rem; color: #fff; margin-bottom: 18px; display: flex; gap: 10px; line-height: 1.5;">
                <span style="color: var(--primary-gold); font-weight: 800;">Q${idx + 1}.</span>
                <span>${escapeHtml(q.question_text)}</span>
              </div>

              <div style="display: flex; flex-direction: column;">
                ${(q.options || ["Option A", "Option B", "Option C", "Option D"]).map((opt) => `
                  <label class="q-choice-label" onclick="this.parentNode.querySelectorAll('.q-choice-label').forEach(l=>l.classList.remove('selected')); this.classList.add('selected');">
                    <input type="radio" name="student_q_${idx}" value="${escapeHtml(opt)}" onchange="studentAnswers[${idx}] = this.value" required>
                    <span style="font-size: 0.98rem; color: #e2e8f0; font-weight: 500;">${escapeHtml(opt)}</span>
                  </label>
                `).join('')}
              </div>
            </div>
          `).join('')}

          <div style="display: flex; gap: 14px; margin-top: 28px;">
            <button type="button" onclick="renderQuizzesListHub()" class="btn btn-outline" style="padding: 16px 28px; font-weight: 700;">
              Cancel
            </button>
            <button type="submit" class="btn-submit-quiz">
              <span>Submit Quiz & View Results</span>
              <i data-lucide="check-circle"></i>
            </button>
          </div>
        </form>
      `;

      if (window.lucide) window.lucide.createIcons();
    }

    function startTimer() {
      clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        timerSeconds--;
        if (timerSeconds <= 0) {
          clearInterval(timerInterval);
          alert("Time's up! Submitting your quiz automatically.");
          submitStudentQuiz();
        } else {
          const mins = Math.floor(timerSeconds / 60);
          const secs = timerSeconds % 60;
          const timerEl = document.getElementById("quiz-timer");
          if (timerEl) timerEl.textContent = `${mins}:${secs < 10 ? '0' : ''}${secs}`;
        }
      }, 1000);
    }

    function submitStudentQuiz(e) {
      if (e) e.preventDefault();
      clearInterval(timerInterval);

      const questions = quizData ? (quizData.questions || []) : [];
      let correctCount = 0;

      questions.forEach((q, idx) => {
        if (studentAnswers[idx] === q.correct_answer) {
          correctCount++;
        }
      });

      const total = questions.length || 1;
      const score = Math.round((correctCount / total) * 100);
      const passScore = quizData ? (quizData.passing_score || 70) : 70;
      const isPassed = score >= passScore;

      const studentId = studentSession ? (studentSession.id || studentSession.phone) : "STU-VIP";
      const studentName = studentSession ? studentSession.name : "Student Champion";

      if (isPassed && quizData) {
        localStorage.setItem(`founders_quiz_passed_${courseId}_${quizData.id}`, "true");
        localStorage.setItem(`founders_quiz_score_${courseId}_${quizData.id}`, String(score));
      }

      // Submit to backend
      if (quizData && quizData.id) {
        fetch(`/api/quizzes/${quizData.id}/submit`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            course_id: courseId,
            student_id: studentId,
            student_name: studentName,
            score: score,
            total_questions: total,
            passed: isPassed
          })
        }).catch(() => {});
      }

      renderResultScreen(score, isPassed, passScore, correctCount, total);
    }

    // Victory Audio Fanfare Sound Synthesizer
    function playVictoryBoomSound() {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctx = new AudioCtx();

        const notes = [261.63, 329.63, 392.00, 523.25, 659.25, 783.99]; // C E G C E G
        notes.forEach((freq, idx) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = "triangle";
          osc.frequency.setValueAtTime(freq, ctx.currentTime + idx * 0.08);

          gain.gain.setValueAtTime(0, ctx.currentTime + idx * 0.08);
          gain.gain.linearRampToValueAtTime(0.3, ctx.currentTime + idx * 0.08 + 0.04);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + idx * 0.08 + 0.35);

          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(ctx.currentTime + idx * 0.08);
          osc.stop(ctx.currentTime + idx * 0.08 + 0.4);
        });
      } catch (_e) {}
    }

    // Explosive Canvas Confetti "Boom Effect"
    function triggerBoomEffect() {
      playVictoryBoomSound();

      if (typeof confetti === "function") {
        // Multi-stage fireworks explosion
        const duration = 3.5 * 1000;
        const animationEnd = Date.now() + duration;

        const interval = setInterval(function() {
          const timeLeft = animationEnd - Date.now();
          if (timeLeft <= 0) {
            return clearInterval(interval);
          }

          const particleCount = 50 * (timeLeft / duration);

          // Center burst
          confetti({
            particleCount: Math.floor(particleCount),
            spread: 90,
            origin: { y: 0.6 },
            colors: ['#f59e0b', '#10b981', '#6366f1', '#ec4899', '#38bdf8']
          });

          // Left & Right Cannons
          confetti({ particleCount: 25, angle: 60, spread: 55, origin: { x: 0 }, colors: ['#f59e0b', '#10b981'] });
          confetti({ particleCount: 25, angle: 120, spread: 55, origin: { x: 1 }, colors: ['#f59e0b', '#6366f1'] });
        }, 250);
      }
    }

    function renderResultScreen(score, isPassed, passScore, correctCount, total) {
      const portalCard = document.getElementById("quiz-portal-card");
      
      const currentIdx = courseQuizzes.findIndex(q => q.id === (quizData ? quizData.id : ""));

      portalCard.innerHTML = `

            <i data-lucide="${isPassed ? 'trophy' : 'alert-circle'}"></i>
          </div>

          <h2 style="font-family: 'Outfit', sans-serif; font-size: 2.2rem; font-weight: 800; color: #fff; margin-bottom: 8px;">
            ${isPassed ? '🔥 BOOM! QUIZ PASSED! 🎉' : 'Assessment Needs Review'}
          </h2>

          <div style="font-size: 3.8rem; font-weight: 800; color: ${isPassed ? '#10b981' : '#ef4444'}; margin-bottom: 10px; text-shadow: 0 0 25px ${isPassed ? 'rgba(16,185,129,0.4)' : 'rgba(239,68,68,0.3)'};">
            ${score}%
          </div>

          <p style="color: var(--text-muted); font-size: 1.05rem; margin-bottom: 28px; max-width: 540px; margin-left: auto; margin-right: auto; line-height: 1.5;">
            ${isPassed ? 
              `Outstanding work! You scored ${correctCount} out of ${total} questions correctly. You have unlocked the next module!` : 
              `You scored ${correctCount} out of ${total} questions correctly. Required passing mark is ${passScore}%. Review the material and retake!`
            }
          </p>

          <div style="display: flex; gap: 16px; justify-content: center; flex-wrap: wrap;">
            <button type="button" onclick="renderQuizzesListHub()" class="btn btn-outline" style="padding: 14px 28px; font-weight: 700;">
              <i data-lucide="list"></i> Course Quizzes Overview
            </button>
            ${isPassed && nextQuiz ? `
              <button type="button" onclick="startSingleQuiz('${nextQuiz.id}')" class="btn btn-primary" style="padding: 14px 32px; background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%); color: #000; font-weight: 800; font-size: 1.05rem; box-shadow: 0 10px 30px var(--gold-glow);">
                🚀 Proceed to Next Quiz (Module ${currentIdx + 2})
              </button>
            ` : (isPassed ? `
              <a href="student-dashboard.html" class="btn btn-primary" style="text-decoration: none; padding: 14px 32px; background: linear-gradient(135deg, #10b981 0%, #059669 100%); color: #fff; font-weight: 800; font-size: 1.05rem; box-shadow: 0 10px 30px rgba(16,185,129,0.4);">
                🎓 Back to Dashboard
              </a>
            ` : `
              <button type="button" class="btn btn-primary" onclick="renderQuizForm()" style="padding: 14px 28px; background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%); color: #000; font-weight: 800;">
                <i data-lucide="refresh-cw"></i> Retake Quiz
              </button>
            `)}
          </div>

          <!-- Official Certificate List & Generator Section -->
          <div style="margin-top: 36px; border-top: 1px solid rgba(255,255,255,0.08); padding-top: 28px; text-align: left;">
            <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; flex-wrap: wrap; gap: 10px;">
              <div>
                <span class="badge badge-gold" style="font-size: 0.75rem;">Verified Credentials</span>
                <h3 style="font-family: 'Outfit', sans-serif; font-size: 1.25rem; font-weight: 700; color: #fff; margin: 4px 0 0 0;">
                  🎓 Course Certificate List
                </h3>
              </div>
              <span style="font-size: 0.82rem; color: ${isPassed ? '#34d399' : '#fbbf24'}; font-weight: 700;">
                ${isPassed ? '🟢 Certificate Generated & Ready' : '🟡 Pass Mark Required (70%+)'}
              </span>
            </div>

            <div style="display: flex; flex-direction: column; gap: 12px;">
              <div style="background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08); border-radius: 16px; padding: 18px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 14px;">
                <div style="display: flex; align-items: center; gap: 14px;">
                  <div style="width: 46px; height: 46px; border-radius: 14px; background: rgba(245,158,11,0.15); border: 1px solid var(--primary-gold); color: var(--primary-gold); display: flex; align-items: center; justify-content: center; font-size: 1.3rem;">
                    <i data-lucide="award"></i>
                  </div>
                  <div>
                    <div style="font-weight: 700; color: #fff; font-size: 1rem;">Official Course Certificate of Completion</div>
                    <div style="font-size: 0.82rem; color: var(--text-muted);">Issued by Founders Academy | Digital Verification ID</div>
                  </div>
                </div>
                <div>
                  ${isPassed ? `
                    <a href="certificate.html?course_id=${encodeURIComponent(courseId)}&student_name=${encodeURIComponent(studentSession ? studentSession.name : 'Student')}" target="_blank" class="btn btn-primary" style="padding: 12px 24px; font-weight: 800; font-size: 0.9rem; text-decoration: none; background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%); color: #000; box-shadow: 0 6px 20px rgba(245,158,11,0.35); display: inline-flex; align-items: center; gap: 8px;">
                      <i data-lucide="award"></i> Generate & Download Certificate
                    </a>
                  ` : `
                    <button type="button" onclick="showLockedMessage(0)" class="btn btn-outline" style="padding: 12px 24px; font-size: 0.88rem; opacity: 0.6; border-color: rgba(255,255,255,0.15); color: #94a3b8;">
                      🔒 Pass Quiz to Generate

                  `}
                </div>
              </div>
            </div>
          </div>
        </div>
      `;

      if (window.lucide) window.lucide.createIcons();
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }
